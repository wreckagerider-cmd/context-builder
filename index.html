<body style="height:100vh;overflow:hidden">
<div id="root" style="height:100vh;display:flex;flex-direction:column"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ─── Storage ──────────────────────────────────────────────────────────────────
const store = {
  get(key, def = null) {
    try { if (window.storage?.get) return window.storage.get(key) ?? def; } catch {}
    try { const v = localStorage.getItem(key); return v != null ? JSON.parse(v) : def; } catch {}
    return def;
  },
  set(key, val) {
    try { if (window.storage?.set) { window.storage.set(key, val); return; } } catch {}
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  },
};

// ─── Utils ────────────────────────────────────────────────────────────────────
const uid    = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const iso    = () => new Date().toISOString();
const slugify = s => (s || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'untitled';

function computeHealth(lastUpdated, lastValidated) {
  const t  = Date.now();
  const u  = lastUpdated   ? new Date(lastUpdated).getTime()   : 0;
  const v  = lastValidated ? new Date(lastValidated).getTime() : 0;
  const W4 = 4 * 7 * 24 * 3600_000;
  const W8 = 8 * 7 * 24 * 3600_000;
  return (t - u) <= W4 && (t - v) <= W8 ? 'fresh' : 'stale';
}

function formatAgo(isoStr) {
  if (!isoStr) return 'never';
  const d = Math.floor((Date.now() - new Date(isoStr).getTime()) / 60_000);
  if (d < 1)    return 'just now';
  if (d < 60)   return `${d}m ago`;
  if (d < 1440) return `${Math.floor(d / 60)}h ago`;
  return `${Math.floor(d / 1440)}d ago`;
}

// persona avatar colors — warm, saturated, distinct
const AVATAR_COLORS = [
  '#f97316','#a855f7','#06b6d4','#ec4899','#22c55e','#eab308','#6366f1','#f43f5e',
];
function avatarColor(str) {
  let h = 0;
  for (let i = 0; i < (str||'').length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
  return AVATAR_COLORS[Math.abs(h) % AVATAR_COLORS.length];
}

// ─── Constants ────────────────────────────────────────────────────────────────
const EVIDENCE_OPTIONS = [
  { value: 'research-backed', label: '🔬 research-backed' },
  { value: 'assumption',      label: '💭 assumption'      },
  { value: 'mixed',           label: '🔀 mixed'           },
];

const BLANK_PERSONA = {
  handle: '', role: '', roleEvidence: 'assumption',
  demographics: '', demographicsEvidence: 'assumption',
  jobsToBeDone: '', jobsToBeDoneEvidence: 'assumption',
  currentAlternatives: '', currentAlternativesEvidence: 'assumption',
  mentalModels: '', mentalModelsEvidence: 'assumption',
  tradeoffPreferences: '', tradeoffPreferencesEvidence: 'assumption',
  vocabularyVoice: '', vocabularyVoiceEvidence: 'assumption',
  dealbreakers: '', dealbreakersEvidence: 'assumption',
  evidenceSummary: '', confidence: 'medium', source: 'assumption',
};

const BLANK_PROBLEM = {
  statement: '', personaId: '',
  triggerConditions: '', triggerEvidence: 'assumption',
  stakes: '', stakesEvidence: 'assumption',
  customerSuccess: '', successEvidence: 'assumption',
  confidence: 'medium', source: 'assumption',
};

const PERSONA_PLACEHOLDERS = {
  handle:              'e.g., Burned-out PM Priya',
  role:                'Job title, life situation, what\'s load-bearing…',
  demographics:        'Optional; only if load-bearing to the design…',
  jobsToBeDone:        'Functional goals, emotional goals, social goals…',
  currentAlternatives: 'What they do instead today; workarounds, hacks…',
  mentalModels:        'What they believe about the problem space (may be wrong)…',
  tradeoffPreferences: 'Speed vs. accuracy, cost vs. quality, control vs. convenience…',
  vocabularyVoice:     'Words they use, words they avoid, register and tone…',
  dealbreakers:        'What would make them walk away or never adopt…',
  evidenceSummary:     'Interview count, sources, notes on what backs this persona up…',
};

const PROBLEM_PLACEHOLDERS = {
  statement:          'One sentence ideally…',
  triggerConditions:  'When does this problem occur…',
  stakes:             'What\'s at stake / what happens if unsolved…',
  customerSuccess:    'What success looks like from their POV, not the business\'s…',
};

const FIELD_LABELS = {
  role: 'Role / Context', demographics: 'Demographics',
  jobsToBeDone: 'Jobs to Be Done', currentAlternatives: 'Current Alternatives',
  mentalModels: 'Mental Models', tradeoffPreferences: 'Tradeoff Preferences',
  vocabularyVoice: 'Vocabulary / Voice', dealbreakers: 'Dealbreakers',
  evidenceSummary: 'Evidence Summary',
};

const FIELD_ICONS = {
  role: '🧑‍💼', demographics: '📊', jobsToBeDone: '🎯',
  currentAlternatives: '🔄', mentalModels: '🧠', tradeoffPreferences: '⚖️',
  vocabularyVoice: '💬', dealbreakers: '🚫', evidenceSummary: '📋',
};

// ─── Markdown generation ──────────────────────────────────────────────────────
function evLabel(ev) {
  const map = { 'research-backed': '🔬 research-backed', assumption: '💭 assumption', mixed: '🔀 mixed' };
  return map[ev] || ev || '';
}

function generatePersonaMarkdown(persona, problems) {
  const related = problems
    .filter(p => p.personaId === persona.id)
    .map(p => `problems/${slugify(p.statement)}.md`);
  const fm = [
    '---',
    'type: persona',
    `handle: ${slugify(persona.handle)}`,
    `last_updated: ${persona.lastUpdated || iso()}`,
    `last_validated: ${persona.lastValidated || iso()}`,
    `confidence: ${persona.confidence || 'medium'}`,
    `source: ${persona.source || 'assumption'}`,
    `related: [${related.join(', ')}]`,
    '---',
  ].join('\n');
  const sec = (h, val, ev) => {
    if (!val) return '';
    const src = ev && ev !== 'none' ? `\n*Source: ${evLabel(ev)}*` : '';
    return `\n\n## ${h}\n${val}${src}`;
  };
  return fm
    + `\n\n# ${persona.handle || 'Unnamed Persona'}`
    + sec('Role / Context',       persona.role,                persona.roleEvidence)
    + sec('Demographics',          persona.demographics,         persona.demographicsEvidence)
    + sec('Jobs to Be Done',       persona.jobsToBeDone,         persona.jobsToBeDoneEvidence)
    + sec('Current Alternatives',  persona.currentAlternatives,  persona.currentAlternativesEvidence)
    + sec('Mental Models',         persona.mentalModels,         persona.mentalModelsEvidence)
    + sec('Tradeoff Preferences',  persona.tradeoffPreferences,  persona.tradeoffPreferencesEvidence)
    + sec('Vocabulary / Voice',    persona.vocabularyVoice,      persona.vocabularyVoiceEvidence)
    + sec('Dealbreakers',          persona.dealbreakers,         persona.dealbreakersEvidence)
    + sec('Evidence Summary',      persona.evidenceSummary,      null)
    + '\n';
}

function generateProblemMarkdown(problem, personas) {
  const persona = personas.find(p => p.id === problem.personaId);
  const related = persona ? [`personas/${slugify(persona.handle)}.md`] : [];
  const fm = [
    '---',
    'type: problem',
    `handle: ${slugify(problem.statement)}`,
    `last_updated: ${problem.lastUpdated || iso()}`,
    `last_validated: ${problem.lastValidated || iso()}`,
    `confidence: ${problem.confidence || 'medium'}`,
    `source: ${problem.source || 'assumption'}`,
    `related: [${related.join(', ')}]`,
    '---',
  ].join('\n');
  const sec = (h, val, ev) => {
    if (!val) return '';
    const src = ev && ev !== 'none' ? `\n*Source: ${evLabel(ev)}*` : '';
    return `\n\n## ${h}\n${val}${src}`;
  };
  return fm
    + `\n\n# ${problem.statement || 'Unnamed Problem'}`
    + (persona ? `\n\n*Persona: ${persona.handle}*` : '')
    + sec('Trigger Conditions',    problem.triggerConditions, problem.triggerEvidence)
    + sec('Stakes',                problem.stakes,            problem.stakesEvidence)
    + sec('Customer-side Success', problem.customerSuccess,   problem.successEvidence)
    + '\n';
}

// ─── Simulation helpers ───────────────────────────────────────────────────────
function buildSystemPrompt(persona, linkedProblems) {
  const f = (label, val, ev) =>
    val ? `### ${label}\n${val}${ev ? `\n*(${evLabel(ev)})*` : ''}` : '';
  const problemsBlock = linkedProblems.length
    ? `\n## Linked Problems\n${linkedProblems.map(p =>
        `**${p.statement}**\n` +
        `- Trigger: ${p.triggerConditions || 'not specified'}\n` +
        `- Stakes: ${p.stakes || 'not specified'}\n` +
        `- Success: ${p.customerSuccess || 'not specified'}`
      ).join('\n\n')}`
    : '';
  return `You are simulating ${persona.handle || 'this persona'}, a persona for design research purposes.

## Persona Context

${f('Role / Context',       persona.role,                persona.roleEvidence)}
${f('Demographics',          persona.demographics,         persona.demographicsEvidence)}
${f('Jobs to Be Done',       persona.jobsToBeDone,         persona.jobsToBeDoneEvidence)}
${f('Current Alternatives',  persona.currentAlternatives,  persona.currentAlternativesEvidence)}
${f('Mental Models',         persona.mentalModels,         persona.mentalModelsEvidence)}
${f('Tradeoff Preferences',  persona.tradeoffPreferences,  persona.tradeoffPreferencesEvidence)}
${f('Vocabulary / Voice',    persona.vocabularyVoice,      persona.vocabularyVoiceEvidence)}
${f('Dealbreakers',          persona.dealbreakers,         persona.dealbreakersEvidence)}
${f('Evidence Summary',      persona.evidenceSummary,      null)}
${problemsBlock}

## Behavior Rules

1. Answer in character as ${persona.handle}. Be specific, human, emotional — real speech, not bullet lists.
2. When you must infer beyond the provided context, mark it inline like this: [INFERENCE: brief note on what's missing from the persona definition]
3. At the end of your response, if the conversation revealed meaningful gaps in the persona definition, append EXACTLY this block (and ONLY if there are gaps):
<gaps>[{"field":"fieldKey","suggestion":"what should be added to this field","inference":"what you assumed to fill it"}]</gaps>
   Valid field keys: role, demographics, jobsToBeDone, currentAlternatives, mentalModels, tradeoffPreferences, vocabularyVoice, dealbreakers, evidenceSummary
   Omit the <gaps> block entirely if no gaps were exposed.
4. Do not break character unless the user types //break.`;
}

function parseGaps(raw) {
  const match = raw.match(/<gaps>(\[[\s\S]*?\])<\/gaps>/);
  let gaps = [];
  if (match) { try { gaps = JSON.parse(match[1]); } catch {} }
  const clean = raw.replace(/<gaps>[\s\S]*?<\/gaps>/, '').trim();
  return { clean, gaps };
}

function renderWithInferences(text) {
  const parts = text.split(/(\[INFERENCE:[^\]]*\])/g);
  return parts.map((part, i) => {
    const m = part.match(/^\[INFERENCE:(.*)\]$/);
    if (m) {
      return (
        <span key={i} style={{display:'inline-flex',alignItems:'center',gap:'4px',background:'#fef3c7',border:'1px solid #fcd34d',color:'#92400e',borderRadius:'6px',padding:'1px 7px',fontSize:'11px',fontWeight:600,margin:'0 2px',verticalAlign:'middle'}}>
          ⚠ {m[1].trim()}
        </span>
      );
    }
    return <span key={i} style={{whiteSpace:'pre-wrap'}}>{part}</span>;
  });
}

async function callClaude(apiKey, messages, systemPrompt) {
  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-5',
      max_tokens: 1024,
      system: systemPrompt,
      messages,
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err?.error?.message || `API error ${res.status}`);
  }
  const data = await res.json();
  return data.content?.[0]?.text || '';
}

// ─── Download helpers ─────────────────────────────────────────────────────────
function downloadBlob(filename, content) {
  const blob = new Blob([content], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: filename });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function downloadAllAsZip(personas, problems) {
  if (!window.JSZip) {
    personas.forEach(p => downloadBlob(`${slugify(p.handle)}.md`,    generatePersonaMarkdown(p, problems)));
    problems.forEach(p => downloadBlob(`${slugify(p.statement)}.md`, generateProblemMarkdown(p, personas)));
    return;
  }
  const zip  = new JSZip();
  const ctx  = zip.folder('context');
  const pf   = ctx.folder('personas');
  const prbf = ctx.folder('problems');
  personas.forEach(p => pf.file(`${slugify(p.handle)}.md`,    generatePersonaMarkdown(p, problems)));
  problems.forEach(p => prbf.file(`${slugify(p.statement)}.md`, generateProblemMarkdown(p, personas)));
  const blob = await zip.generateAsync({ type: 'blob' });
  const url  = URL.createObjectURL(blob);
  const a    = Object.assign(document.createElement('a'), { href: url, download: 'context.zip' });
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ─────────────────────────────────────────────────────────────────────────────
// Components
// ─────────────────────────────────────────────────────────────────────────────

function HealthBadge({ lastUpdated, lastValidated }) {
  const h = computeHealth(lastUpdated, lastValidated);
  return h === 'fresh'
    ? <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:999,background:'#d1fae5',color:'#065f46',border:'1.5px solid #6ee7b7',whiteSpace:'nowrap'}} title={`validated ${formatAgo(lastValidated)}`}>● Fresh</span>
    : <span style={{display:'inline-flex',alignItems:'center',gap:4,fontSize:11,fontWeight:700,padding:'2px 8px',borderRadius:999,background:'#ffedd5',color:'#9a3412',border:'1.5px solid #fdba74',whiteSpace:'nowrap'}} title="re-read before using">● Stale</span>;
}

function EvidenceSelect({ value, onChange, className }) {
  return (
    <select
      value={value || 'assumption'}
      onChange={e => onChange(e.target.value)}
      style={{background:'#fff7ed',border:'1.5px solid #fed7aa',borderRadius:8,padding:'3px 8px',fontSize:11,fontWeight:600,color:'#7c3a21',cursor:'pointer'}}
      className={className}
    >
      {EVIDENCE_OPTIONS.map(o => <option key={o.value} value={o.value}>{o.label}</option>)}
    </select>
  );
}

function ConfidenceSelect({ value, onChange }) {
  return (
    <select
      value={value || 'medium'}
      onChange={e => onChange(e.target.value)}
      style={{background:'#fff7ed',border:'1.5px solid #fed7aa',borderRadius:8,padding:'3px 8px',fontSize:11,fontWeight:600,color:'#7c3a21',cursor:'pointer'}}
    >
      <option value="high">High confidence</option>
      <option value="medium">Medium confidence</option>
      <option value="low">Low confidence</option>
    </select>
  );
}

// ─── Persona Form ─────────────────────────────────────────────────────────────
function PersonaForm({ initial, onSave, pendingPromotion, onPromotionApplied }) {
  const [form, setForm] = useState({ ...BLANK_PERSONA, ...initial });
  const fieldRefs = useRef({});

  useEffect(() => {
    if (!pendingPromotion?.field) return;
    const { field, suggestion } = pendingPromotion;
    setForm(f => ({
      ...f,
      [field]: f[field] ? `${f[field]}\n\n[suggested: ${suggestion}]` : suggestion,
    }));
    setTimeout(() => {
      const el = fieldRefs.current[field];
      if (el) { el.focus(); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
    }, 50);
    onPromotionApplied?.();
  }, [pendingPromotion]);

  const set = (key, val) => setForm(f => ({ ...f, [key]: val }));

  const handleSave = () => {
    if (!form.handle.trim()) { alert('Handle is required.'); return; }
    onSave({ ...form, lastUpdated: iso() });
  };

  const inputCls = {
    width: '100%',
    background: '#fff',
    border: '2px solid #fed7aa',
    borderRadius: 12,
    padding: '9px 12px',
    fontSize: 13,
    fontFamily: 'inherit',
    color: '#1c1412',
    transition: 'border-color 0.15s, box-shadow 0.15s',
  };
  const focusStyle = 'focus-orange';

  const renderField = (fieldKey, label, { required, multiline, noEvidence } = {}) => {
    const icon = FIELD_ICONS[fieldKey] || '';
    return (
      <div key={fieldKey} style={{display:'flex',flexDirection:'column',gap:6}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',gap:8}}>
          <label style={{fontSize:13,fontWeight:700,color:'#7c3a21',display:'flex',alignItems:'center',gap:5}}>
            {icon && <span>{icon}</span>}
            {label}
            {required && <span style={{color:'#ef4444',marginLeft:2}}>*</span>}
          </label>
          {!noEvidence && (
            <EvidenceSelect
              value={form[fieldKey + 'Evidence']}
              onChange={v => set(fieldKey + 'Evidence', v)}
            />
          )}
        </div>
        {multiline ? (
          <textarea
            ref={el => fieldRefs.current[fieldKey] = el}
            value={form[fieldKey] || ''}
            onChange={e => set(fieldKey, e.target.value)}
            rows={3}
            placeholder={PERSONA_PLACEHOLDERS[fieldKey] || ''}
            style={{...inputCls, resize:'vertical'}}
            onFocus={e => { e.target.style.borderColor='#f97316'; e.target.style.boxShadow='0 0 0 3px #fed7aa66'; }}
            onBlur={e => { e.target.style.borderColor='#fed7aa'; e.target.style.boxShadow='none'; }}
            className="sc"
          />
        ) : (
          <input
            ref={el => fieldRefs.current[fieldKey] = el}
            type="text"
            value={form[fieldKey] || ''}
            onChange={e => set(fieldKey, e.target.value)}
            placeholder={PERSONA_PLACEHOLDERS[fieldKey] || ''}
            style={inputCls}
            onFocus={e => { e.target.style.borderColor='#f97316'; e.target.style.boxShadow='0 0 0 3px #fed7aa66'; }}
            onBlur={e => { e.target.style.borderColor='#fed7aa'; e.target.style.boxShadow='none'; }}
          />
        )}
      </div>
    );
  };

  return (
    <div className="sc" style={{height:'100%',overflowY:'auto',padding:'24px',display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
        {renderField('handle', 'Handle', { required: true })}
        <div style={{display:'flex',flexDirection:'column',gap:6}}>
          <label style={{fontSize:13,fontWeight:700,color:'#7c3a21'}}>📊 Overall confidence</label>
          <div style={{display:'flex',gap:8}}>
            <ConfidenceSelect value={form.confidence} onChange={v => set('confidence', v)} />
            <EvidenceSelect   value={form.source}     onChange={v => set('source', v)} />
          </div>
        </div>
      </div>
      {renderField('role',                'Role / Context',       { multiline: true })}
      {renderField('demographics',         'Demographics',         { multiline: true })}
      {renderField('jobsToBeDone',         'Jobs to Be Done',      { multiline: true })}
      {renderField('currentAlternatives',  'Current Alternatives', { multiline: true })}
      {renderField('mentalModels',         'Mental Models',        { multiline: true })}
      {renderField('tradeoffPreferences',  'Tradeoff Preferences', { multiline: true })}
      {renderField('vocabularyVoice',      'Vocabulary / Voice',   { multiline: true })}
      {renderField('dealbreakers',         'Dealbreakers',         { multiline: true })}
      {renderField('evidenceSummary',      'Evidence Summary',     { multiline: true, noEvidence: true })}
      <div style={{paddingBottom: 32}}>
        <button
          onClick={handleSave}
          className="puffy"
          style={{background:'#f97316',color:'#fff',border:'none',borderRadius:14,padding:'10px 24px',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 0 #c2410c',fontFamily:'inherit'}}
          onMouseEnter={e => e.target.style.background='#ea580c'}
          onMouseLeave={e => e.target.style.background='#f97316'}
        >
          Save Persona
        </button>
      </div>
    </div>
  );
}

// ─── Problem Form ─────────────────────────────────────────────────────────────
function ProblemForm({ initial, personas, onSave }) {
  const [form, setForm] = useState({ ...BLANK_PROBLEM, ...initial });
  const set = (key, val) => setForm(f => ({ ...f, [key]: val }));

  const handleSave = () => {
    if (!form.statement.trim()) { alert('Problem statement is required.'); return; }
    onSave({ ...form, lastUpdated: iso() });
  };

  const inputCls = {
    width: '100%', background: '#fff',
    border: '2px solid #fed7aa', borderRadius: 12,
    padding: '9px 12px', fontSize: 13, fontFamily: 'inherit',
    color: '#1c1412', transition: 'border-color 0.15s, box-shadow 0.15s',

  const renderField = (fieldKey, label, evidenceKey, icon='') => (

          <EvidenceSelect value={form[evidenceKey]} onChange={v => set(evidenceKey, v)} />

      </div>
      <textarea
        value={form[fieldKey] || ''}
        onChange={e => set(fieldKey, e.target.value)}
        rows={fieldKey === 'statement' ? 2 : 3}
        placeholder={PROBLEM_PLACEHOLDERS[fieldKey] || ''}
        style={{...inputCls, resize:'vertical'}}
        onFocus={e => { e.target.style.borderColor='#f97316'; e.target.style.boxShadow='0 0 0 3px #fed7aa66'; }}

  return (
    <div className="sc" style={{height:'100%',overflowY:'auto',padding:'24px',display:'flex',flexDirection:'column',gap:20}}>

          value={form.statement || ''}
          onChange={e => set('statement', e.target.value)}
          rows={2}
          placeholder={PROBLEM_PLACEHOLDERS.statement}
          style={{width:'100%',background:'#fff',border:'2px solid #fed7aa',borderRadius:12,padding:'9px 12px',fontSize:13,fontFamily:'inherit',color:'#1c1412',resize:'vertical'}}

          onBlur={e => { e.target.style.borderColor='#fed7aa'; e.target.style.boxShadow='none'; }}
          className="sc"
        />
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:6}}>
        <label style={{fontSize:13,fontWeight:700,color:'#7c3a21'}}>🧑 Who has it</label>
        <select
          value={form.personaId || ''}
          onChange={e => set('personaId', e.target.value)}
          style={{width:'100%',background:'#fff',border:'2px solid #fed7aa',borderRadius:12,padding:'9px 12px',fontSize:13,fontFamily:'inherit',color:'#1c1412',cursor:'pointer'}}
          onFocus={e => { e.target.style.borderColor='#f97316'; }}
          onBlur={e => { e.target.style.borderColor='#fed7aa'; }}
        >
          <option value="">— select persona —</option>
          {personas.map(p => <option key={p.id} value={p.id}>{p.handle || 'Unnamed'}</option>)}
        </select>
      </div>
      {renderField('triggerConditions', 'Trigger Conditions',    'triggerEvidence', '⚡')}
      {renderField('stakes',            'Stakes',                'stakesEvidence',  '⚠️')}
      {renderField('customerSuccess',   'Customer-side Success', 'successEvidence', '✅')}
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <ConfidenceSelect value={form.confidence} onChange={v => set('confidence', v)} />
        <EvidenceSelect   value={form.source}     onChange={v => set('source', v)} />
      </div>
      <div style={{paddingBottom:32}}>
        <button
          onClick={handleSave}
          className="puffy"
          style={{background:'#f97316',color:'#fff',border:'none',borderRadius:14,padding:'10px 24px',fontSize:14,fontWeight:700,cursor:'pointer',boxShadow:'0 4px 0 #c2410c',fontFamily:'inherit'}}
          onMouseEnter={e => e.target.style.background='#ea580c'}
          onMouseLeave={e => e.target.style.background='#f97316'}
        >
          Save Problem
        </button>
      </div>
    </div>
  );
}

// ─── Simulate Tab ─────────────────────────────────────────────────────────────
function SimulateTab({ persona, linkedProblems, apiKey, onPromote }) {
  const [messages, setMessages] = useState([]);
  const [input,    setInput]    = useState('');
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState(null);
  const [allGaps,  setAllGaps]  = useState([]);
  const bottomRef = useRef(null);
  const inputRef  = useRef(null);

  useEffect(() => {
    bottomRef.current?.scrollIntoView({ behavior: 'smooth' });
  }, [messages, loading]);

  const systemPrompt = useMemo(
    () => buildSystemPrompt(persona, linkedProblems),
    [persona, linkedProblems]
  );

  const send = async () => {
    if (!input.trim() || loading) return;
    if (!apiKey) { setError('Add your Anthropic API key in ⚙ Settings.'); return; }
    const userMsg    = { role: 'user', content: input.trim() };
    const newHistory = [...messages, userMsg];
    setMessages(newHistory);
    setInput('');
    setLoading(true);
    setError(null);
    try {
      const apiMsgs = newHistory.map(m => ({ role: m.role, content: m.content }));
      const raw = await callClaude(apiKey, apiMsgs, systemPrompt);
      const { clean, gaps } = parseGaps(raw);
      setMessages(prev => [...prev, { role: 'assistant', content: raw, clean, gaps }]);
      if (gaps.length) setAllGaps(prev => [...prev, ...gaps.map(g => ({ ...g, id: uid() }))]);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
      inputRef.current?.focus();
    }
  };

  const handleKeyDown = e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
  };

  const color = avatarColor(persona.handle || '?');
  const avatar = (persona.handle || '?')[0].toUpperCase();

  return (
    <div style={{height:'100%',display:'flex',overflow:'hidden'}}>
      {/* Chat */}
      <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden'}}>
        {/* Header */}
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'10px 18px',borderBottom:'2px solid #fed7aa',flexShrink:0,background:'#fff7ed'}}>
          <div style={{width:36,height:36,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:16,fontWeight:800,color:'#fff',flexShrink:0,boxShadow:`0 3px 0 ${color}99`}}>
            {avatar}
          </div>
          <div style={{flex:1,minWidth:0}}>
            <p style={{margin:0,fontSize:14,fontWeight:800,color:'#1c1412',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{persona.handle || 'Unnamed'}</p>
            <p style={{margin:0,fontSize:11,color:'#a07050',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{persona.role || 'No role defined'}</p>
          </div>
          <HealthBadge lastUpdated={persona.lastUpdated} lastValidated={persona.lastValidated} />
        </div>

        {/* Messages */}
        <div className="sc" style={{flex:1,overflowY:'auto',padding:'16px 18px',display:'flex',flexDirection:'column',gap:14,background:'#fef9f4'}}>
          {messages.length === 0 && (
            <div style={{display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',height:'100%',paddingBottom:40,textAlign:'center'}}>
              <div style={{width:64,height:64,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:28,fontWeight:800,color:'#fff',marginBottom:16,boxShadow:`0 6px 0 ${color}88`}}>
                {avatar}
              </div>
              <p style={{margin:'0 0 6px',fontSize:15,fontWeight:800,color:'#1c1412'}}>Talk to {persona.handle || 'this persona'}</p>
              <p style={{margin:0,fontSize:12,color:'#a07050',maxWidth:280,lineHeight:1.5}}>Ask about their workflow, frustrations, or how they'd react to your product. Gaps surface in the sidebar.</p>
            </div>
          )}

          {messages.map((msg, i) => (
            <div key={i} style={{display:'flex',gap:10,justifyContent:msg.role==='user'?'flex-end':'flex-start'}}>
              {msg.role === 'assistant' && (
                <div style={{width:28,height:28,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:'#fff',flexShrink:0,marginTop:2,boxShadow:`0 2px 0 ${color}88`}}>
                  {avatar}
                </div>
              )}
              <div style={{
                maxWidth:'74%',borderRadius:18,padding:'10px 14px',fontSize:13,lineHeight:1.55,
                ...(msg.role==='user'
                  ? {background:'#f97316',color:'#fff',borderTopRightRadius:4,boxShadow:'0 3px 0 #c2410c'}
                  : {background:'#fff',color:'#1c1412',borderTopLeftRadius:4,border:'2px solid #fed7aa',boxShadow:'0 2px 8px rgba(180,100,30,0.08)'})
              }}>
                {msg.role==='assistant'
                  ? <div>{renderWithInferences(msg.clean || msg.content)}</div>
                  : <div style={{whiteSpace:'pre-wrap'}}>{msg.content}</div>
                }
                {msg.gaps?.length > 0 && (
                  <div style={{marginTop:6,paddingTop:6,borderTop:'1px solid rgba(251,191,36,0.4)',fontSize:11,fontWeight:700,color:'#b45309'}}>
                    {msg.gaps.length} gap{msg.gaps.length > 1 ? 's' : ''} detected →
                  </div>
                )}
              </div>
              {msg.role === 'user' && (
                <div style={{width:28,height:28,borderRadius:'50%',background:'#f97316',display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:'#fff',flexShrink:0,marginTop:2,boxShadow:'0 2px 0 #c2410c'}}>
                  U
                </div>
              )}
            </div>
          ))}

          {loading && (
            <div style={{display:'flex',gap:10,justifyContent:'flex-start'}}>
              <div style={{width:28,height:28,borderRadius:'50%',background:color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:12,fontWeight:800,color:'#fff',flexShrink:0,boxShadow:`0 2px 0 ${color}88`}}>
                {avatar}
              </div>
              <div style={{background:'#fff',border:'2px solid #fed7aa',borderRadius:18,borderTopLeftRadius:4,padding:'10px 16px',boxShadow:'0 2px 8px rgba(180,100,30,0.08)'}}>
                <div style={{display:'flex',gap:5,alignItems:'center',height:14}}>
                  <span className="dot1" style={{width:7,height:7,borderRadius:'50%',background:'#f97316',display:'inline-block'}} />
                  <span className="dot2" style={{width:7,height:7,borderRadius:'50%',background:'#fb923c',display:'inline-block'}} />
                  <span className="dot3" style={{width:7,height:7,borderRadius:'50%',background:'#fdba74',display:'inline-block'}} />
                </div>
              </div>
            </div>
          )}
          <div ref={bottomRef} />
        </div>

        {error && (
          <div style={{margin:'0 16px 8px',padding:'8px 12px',background:'#fff1f2',border:'2px solid #fecdd3',borderRadius:10,fontSize:12,fontWeight:600,color:'#9f1239',flexShrink:0}}>
            {error}
          </div>
        )}

        {/* Input */}
        <div style={{padding:'12px 16px',borderTop:'2px solid #fed7aa',flexShrink:0,background:'#fff7ed'}}>
          <div style={{display:'flex',gap:8,alignItems:'flex-end'}}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={e => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
              rows={2}
              disabled={loading}
              placeholder={`Talk to ${persona.handle || 'this persona'}… (Enter to send)`}
              style={{flex:1,background:'#fff',border:'2px solid #fed7aa',borderRadius:14,padding:'9px 13px',fontSize:13,fontFamily:'inherit',color:'#1c1412',resize:'none',transition:'border-color 0.15s,box-shadow 0.15s'}}
              onFocus={e => { e.target.style.borderColor='#f97316'; e.target.style.boxShadow='0 0 0 3px #fed7aa66'; }}
              onBlur={e => { e.target.style.borderColor='#fed7aa'; e.target.style.boxShadow='none'; }}
              className="sc"
            />
            <button
              onClick={send}
              disabled={loading || !input.trim()}
              className="puffy"
              style={{background: loading||!input.trim() ? '#fcd9b3':'#f97316',color:'#fff',border:'none',borderRadius:14,padding:'10px 18px',fontSize:14,fontWeight:800,cursor:loading||!input.trim()?'not-allowed':'pointer',boxShadow:loading||!input.trim()?'0 3px 0 #e5bfa0':'0 4px 0 #c2410c',fontFamily:'inherit',alignSelf:'flex-end',flexShrink:0,transition:'background 0.1s'}}
            >
              Send
            </button>
          </div>
        </div>
      </div>

      <GapPanel
        gaps={allGaps}
        onPromote={gap => onPromote(gap)}
        onDismiss={id => setAllGaps(g => g.filter(x => x.id !== id))}
      />
    </div>
  );
}

        <button
          onClick={() => onNew('problem')}
          className="puffy"

          {problems.map(p => {
            const active = selectedType === 'problem' && selectedId === p.id;

              <button

// ─── Top Bar ──────────────────────────────────────────────────────────────────
function TopBar({ projectName, onProjectNameChange, personas, problems, apiKey, onApiKeyChange, onExportAll }) {
  const [editingName,  setEditingName]  = useState(false);
  const [nameVal,      setNameVal]      = useState(projectName);
  const [showKey,      setShowKey]      = useState(false);
  const [showSettings, setShowSettings] = useState(false);
  const settingsRef = useRef(null);

  useEffect(() => { setNameVal(projectName); }, [projectName]);
  useEffect(() => {
    const handler = e => {
      if (showSettings && settingsRef.current && !settingsRef.current.contains(e.target))
        setShowSettings(false);
    };
    document.addEventListener('mousedown', handler);
    return () => document.removeEventListener('mousedown', handler);
  }, [showSettings]);

  const commitName = () => {
    setEditingName(false);
    if (nameVal.trim()) onProjectNameChange(nameVal.trim());
  };

  const totalCount = personas.length + problems.length;
  const staleCount = [...personas, ...problems].filter(
    x => computeHealth(x.lastUpdated, x.lastValidated) === 'stale'
  ).length;

  return (
    <div style={{height:56,borderBottom:'2px solid #fed7aa',display:'flex',alignItems:'center',padding:'0 20px',gap:14,background:'#fff',flexShrink:0,boxShadow:'0 2px 12px rgba(180,100,30,0.08)'}}>
      {/* Logo mark */}
      <div style={{width:28,height:28,borderRadius:8,background:'linear-gradient(135deg,#f97316,#a855f7)',display:'flex',alignItems:'center',justifyContent:'center',fontSize:14,flexShrink:0,boxShadow:'0 2px 0 #c2410c'}}>
        📐
      </div>

      {/* Project name */}
      {editingName ? (
        <input
          autoFocus
          value={nameVal}
          onChange={e => setNameVal(e.target.value)}
          onBlur={commitName}
          onKeyDown={e => { if (e.key==='Enter') commitName(); if (e.key==='Escape') setEditingName(false); }}
          style={{background:'transparent',border:'none',borderBottom:'2px solid #f97316',fontSize:16,fontWeight:800,color:'#1c1412',fontFamily:'inherit',width:180,outline:'none'}}
        />
      ) : (
        <button
          onClick={() => setEditingName(true)}
          style={{background:'none',border:'none',fontSize:16,fontWeight:800,color:'#1c1412',cursor:'pointer',fontFamily:'inherit',padding:0}}
          title="Click to rename"
        >
          {projectName}
        </button>
      )}

      <div style={{width:1,height:20,background:'#fed7aa',flexShrink:0}} />

      {/* Health summary */}
      {totalCount > 0 && (
        <div style={{display:'flex',alignItems:'center',gap:8,fontSize:12,fontWeight:600}}>
          <span style={{color:'#a07050'}}>{totalCount} item{totalCount!==1?'s':''}</span>
          {staleCount === 0
            ? <span style={{color:'#059669',background:'#d1fae5',padding:'2px 8px',borderRadius:999,fontSize:11,fontWeight:700}}>all fresh ✓</span>
            : <span style={{color:'#9a3412',background:'#ffedd5',padding:'2px 8px',borderRadius:999,fontSize:11,fontWeight:700}}>{staleCount} stale ⚠</span>
          }
        </div>
      )}

      <div style={{flex:1}} />

      {/* Settings */}
      <div style={{position:'relative'}} ref={settingsRef}>
        <button
          onClick={() => setShowSettings(s => !s)}
          className="puffy"
          style={{background:showSettings?'#fff7ed':'#fff',border:'2px solid #fed7aa',borderRadius:10,padding:'5px 12px',fontSize:12,fontWeight:700,color:'#9a3412',cursor:'pointer',boxShadow:'0 2px 0 #fcd7aa',fontFamily:'inherit'}}
        >
          ⚙ Settings
        </button>
        {showSettings && (
          <div style={{position:'absolute',right:0,top:'calc(100% + 8px)',width:296,background:'#fff',border:'2px solid #fed7aa',borderRadius:16,boxShadow:'0 12px 40px rgba(180,100,30,0.18)',padding:16,zIndex:50}}>
            <p style={{margin:'0 0 8px',fontSize:12,fontWeight:800,color:'#9a3412'}}>Anthropic API Key</p>
            <div style={{display:'flex',gap:8,marginBottom:6}}>
              <input
                type={showKey ? 'text' : 'password'}
                value={apiKey}
                onChange={e => onApiKeyChange(e.target.value)}
                placeholder="sk-ant-…"
                style={{flex:1,background:'#fff7ed',border:'2px solid #fed7aa',borderRadius:10,padding:'7px 10px',fontSize:12,fontFamily:'inherit',color:'#1c1412'}}
                onFocus={e => { e.target.style.borderColor='#f97316'; }}
                onBlur={e => { e.target.style.borderColor='#fed7aa'; }}
              />
              <button
                onClick={() => setShowKey(v => !v)}
                style={{background:'#fff7ed',border:'2px solid #fed7aa',borderRadius:10,padding:'7px 10px',fontSize:14,cursor:'pointer'}}
              >{showKey ? '🙈' : '👁'}</button>
            </div>
            <p style={{margin:0,fontSize:11,color:'#c4956a',lineHeight:1.5}}>
              Required for persona simulation. Stored in-browser only.
            </p>
          </div>
        )}
      </div>

      {/* Export */}
      <button
        onClick={onExportAll}
        disabled={totalCount === 0}
        className="puffy"
        style={{background: totalCount===0?'#f5e6d8':'#06b6d4',color: totalCount===0?'#c4956a':'#fff',border:'none',borderRadius:10,padding:'6px 14px',fontSize:12,fontWeight:800,cursor:totalCount===0?'not-allowed':'pointer',boxShadow:totalCount===0?'0 2px 0 #e2c9a8':'0 3px 0 #0891b2',fontFamily:'inherit',transition:'background 0.1s'}}
        onMouseEnter={e => { if(totalCount>0) e.target.style.background='#0891b2'; }}
        onMouseLeave={e => { if(totalCount>0) e.target.style.background='#06b6d4'; }}
      >
        ↓ Export all
      </button>
    </div>
  );
}

// ─── Main Panel ───────────────────────────────────────────────────────────────
function MainPanel({ selectedId, selectedType, personas, problems, apiKey, onSavePersona, onSaveProblem, onValidate }) {
  const [activeTab,        setActiveTab]        = useState('form');
  const [pendingPromotion, setPendingPromotion] = useState(null);

  useEffect(() => { setActiveTab('form'); setPendingPromotion(null); }, [selectedId, selectedType]);

  const item = selectedType === 'persona'
    ? personas.find(p => p.id === selectedId)
    : problems.find(p => p.id === selectedId);

  if (!item) {
    return (
      <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',background:'#fef9f4'}}>
        <div style={{textAlign:'center'}}>
          <div style={{fontSize:56,marginBottom:16}}>🗂️</div>
          <p style={{margin:'0 0 6px',fontSize:16,fontWeight:700,color:'#7c3a21'}}>Nothing selected</p>
          <p style={{margin:0,fontSize:13,color:'#c4956a'}}>Pick a persona or problem from the left,<br />or create a new one.</p>
        </div>
      </div>
    );
  }

  const tabs           = selectedType === 'persona' ? ['form', 'preview', 'simulate'] : ['form', 'preview'];
  const linkedProblems = selectedType === 'persona' ? problems.filter(p => p.personaId === selectedId) : [];
  const mdContent      = selectedType === 'persona' ? generatePersonaMarkdown(item, problems) : generateProblemMarkdown(item, personas);
  const mdFilename     = selectedType === 'persona'
    ? `context/personas/${slugify(item.handle)}.md`
    : `context/problems/${slugify(item.statement)}.md`;

  const handlePromote = gap => {
    setPendingPromotion({ field: gap.field, suggestion: gap.suggestion });
    setActiveTab('form');
  };

  const color = selectedType === 'persona' ? avatarColor(item.handle || '?') : '#8b5cf6';

  return (
    <div style={{flex:1,display:'flex',flexDirection:'column',minWidth:0,overflow:'hidden',background:'#fef9f4'}}>
      {/* Panel header */}
      <div style={{display:'flex',alignItems:'center',gap:14,padding:'10px 20px',borderBottom:'2px solid #fed7aa',flexShrink:0,background:'#fff'}}>
        <div style={{width:38,height:38,borderRadius:12,background:color,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18,fontWeight:800,color:'#fff',flexShrink:0,boxShadow:`0 3px 0 ${color}88`}}>
          {selectedType === 'persona' ? (item.handle||'?')[0].toUpperCase() : '🎯'}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:2}}>
            <h2 style={{margin:0,fontSize:15,fontWeight:800,color:'#1c1412',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
              {selectedType === 'persona' ? (item.handle||'Unnamed Persona') : (item.statement||'Unnamed Problem')}
            </h2>
            <HealthBadge lastUpdated={item.lastUpdated} lastValidated={item.lastValidated} />
          </div>
          <p style={{margin:0,fontSize:11,color:'#a07050',fontWeight:500}}>
            Updated {formatAgo(item.lastUpdated)} · Validated {formatAgo(item.lastValidated)}
          </p>
        </div>
        <button
          onClick={() => onValidate(selectedType, selectedId)}
          className="puffy"
          style={{background:'#22c55e',color:'#fff',border:'none',borderRadius:10,padding:'6px 14px',fontSize:12,fontWeight:800,cursor:'pointer',boxShadow:'0 3px 0 #16a34a',fontFamily:'inherit',flexShrink:0}}
          title="Assert this is still accurate"
          onMouseEnter={e => e.target.style.background='#16a34a'}
          onMouseLeave={e => e.target.style.background='#22c55e'}
        >
          ✓ Validate
        </button>
      </div>

      {/* Tabs */}
      <div style={{display:'flex',gap:6,padding:'10px 20px 0',borderBottom:'2px solid #fed7aa',flexShrink:0,background:'#fff7ed'}}>
        {tabs.map(tab => (
          <button
            key={tab}
            onClick={() => setActiveTab(tab)}
            className={`tab-pill${activeTab===tab?' active':''}`}
            style={{background:'none',border:'none',cursor:'pointer',fontFamily:'inherit',marginBottom:'-2px'}}
          >
            {tab === 'form' ? '📝 Form' : tab === 'preview' ? '👁 Preview' : '💬 Simulate'}
          </button>
        ))}
      </div>

      {/* Tab content */}
      <div style={{flex:1,overflow:'hidden'}}>
        {activeTab==='form' && selectedType==='persona' && (
          <PersonaForm
            key={selectedId}
            initial={item}
            onSave={data => onSavePersona({ ...item, ...data })}
            pendingPromotion={pendingPromotion}
            onPromotionApplied={() => setPendingPromotion(null)}
          />
        )}
        {activeTab==='form' && selectedType==='problem' && (
          <ProblemForm
            key={selectedId}
            initial={item}
            personas={personas}
            onSave={data => onSaveProblem({ ...item, ...data })}
          />
        )}
        {activeTab==='preview' && (
          <MarkdownPreview
            content={mdContent}
            filename={mdFilename}
            onDownload={() => downloadBlob(mdFilename.split('/').pop(), mdContent)}
          />
        )}
        {activeTab==='simulate' && selectedType==='persona' && (
          <SimulateTab
            key={selectedId}
            persona={item}
            linkedProblems={linkedProblems}
            apiKey={apiKey}
            onPromote={handlePromote}
          />
        )}
      </div>
    </div>
  );
}

// ─── App ──────────────────────────────────────────────────────────────────────
function App() {
  const [projectName, setProjectName] = useState(() => store.get('projectName', 'My Project'));
  const [personas,    setPersonas]    = useState(() => store.get('personas', []));
  const [problems,    setProblems]    = useState(() => store.get('problems', []));
  const [apiKey,      setApiKey]      = useState(() => store.get('apiKey', ''));
  const [selectedId,   setSelectedId]   = useState(null);
  const [selectedType, setSelectedType] = useState(null);

  useEffect(() => { store.set('projectName', projectName); }, [projectName]);
  useEffect(() => { store.set('personas', personas);       }, [personas]);
  useEffect(() => { store.set('problems', problems);       }, [problems]);
  useEffect(() => { store.set('apiKey', apiKey);           }, [apiKey]);

  const handleNew = type => {
    const t = iso();
    if (type === 'persona') {
      const p = { ...BLANK_PERSONA, id: uid(), lastUpdated: t, lastValidated: t };
      setPersonas(prev => [...prev, p]);
      setSelectedId(p.id);
      setSelectedType('persona');
    } else {
      const p = { ...BLANK_PROBLEM, id: uid(), lastUpdated: t, lastValidated: t };
      setProblems(prev => [...prev, p]);
      setSelectedId(p.id);
      setSelectedType('problem');
    }
  };

  const handleSavePersona = persona => setPersonas(prev => prev.map(p => p.id===persona.id ? persona : p));
  const handleSaveProblem = problem => setProblems(prev => prev.map(p => p.id===problem.id ? problem : p));

  const handleValidate = (type, id) => {
    const t = iso();
    if (type==='persona') setPersonas(prev => prev.map(p => p.id===id ? {...p,lastValidated:t} : p));
    else                  setProblems(prev => prev.map(p => p.id===id ? {...p,lastValidated:t} : p));
  };

  return (
    <div style={{height:'100vh',display:'flex',flexDirection:'column',background:'#fef7ee'}}>
      <TopBar
        projectName={projectName}
        onProjectNameChange={setProjectName}
        personas={personas}
        problems={problems}
        apiKey={apiKey}
        onApiKeyChange={setApiKey}
        onExportAll={() => downloadAllAsZip(personas, problems)}
      />
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <LeftRail
          personas={personas}
          problems={problems}
          selectedId={selectedId}
          selectedType={selectedType}
          onSelect={(type, id) => { setSelectedType(type); setSelectedId(id); }}
          onNew={handleNew}
        />
        <MainPanel
          selectedId={selectedId}
          selectedType={selectedType}
          personas={personas}
          problems={problems}
          apiKey={apiKey}
          onSavePersona={handleSavePersona}
          onSaveProblem={handleSaveProblem}
          onValidate={handleValidate}
        />
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
